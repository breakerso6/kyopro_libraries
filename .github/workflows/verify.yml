name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout AtCoder Library
        uses: actions/checkout@v7
        with:
          repository: atcoder/ac-library
          path: ac-library

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-verification.txt

      - name: Install verification-helper
        run: python -m pip install --requirement requirements-verification.txt

      - name: Test include expander
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test AtCoder userscript
        run: node --test tests/atcoder_library_expander.test.cjs

      - name: Run verification
        run: oj-verify run --jobs 2
